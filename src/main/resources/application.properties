spring.application.name=perubilling
spring.profiles.default=local
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/perubilling}
spring.datasource.username=${DATABASE_USERNAME:perubilling}
spring.datasource.password=${DATABASE_PASSWORD:perubilling}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.security.jwt.issuer=${JWT_ISSUER:perubilling}
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.security.master-key=${MASTER_KEY:}
app.security.api-key-pepper=${API_KEY_PEPPER:}

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.tenant-name=${BOOTSTRAP_TENANT_NAME:PeruBilling Local}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.artifacts.root=${ARTIFACTS_ROOT:./data/artifacts}
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
app.processing.batch-size=${PROCESSING_BATCH_SIZE:10}
app.processing.poll-ms=${PROCESSING_POLL_MS:2000}
app.processing.max-attempts=${PROCESSING_MAX_ATTEMPTS:6}
app.processing.stale-minutes=${PROCESSING_STALE_MINUTES:15}
app.sunat.rules.max-direct-age-days=${SUNAT_MAX_DIRECT_AGE_DAYS:3}
app.sunat.rules.max-summary-age-days=${SUNAT_MAX_SUMMARY_AGE_DAYS:7}
app.sunat.rules.version=${SUNAT_RULES_VERSION:2026-08-26}

app.webhooks.poll-ms=${WEBHOOK_POLL_MS:3000}
app.webhooks.max-attempts=${WEBHOOK_MAX_ATTEMPTS:8}
app.webhooks.connect-timeout-seconds=${WEBHOOK_CONNECT_TIMEOUT_SECONDS:5}
app.webhooks.request-timeout-seconds=${WEBHOOK_REQUEST_TIMEOUT_SECONDS:10}

app.sunat.beta-url=${SUNAT_BETA_URL:https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
app.sunat.production-url=${SUNAT_PRODUCTION_URL:https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
app.sunat.consult-url=${SUNAT_CONSULT_URL:https://e-factura.sunat.gob.pe/ol-it-wsconscpegem/billConsultService}
app.sunat.connect-timeout-seconds=${SUNAT_CONNECT_TIMEOUT_SECONDS:10}
app.sunat.request-timeout-seconds=${SUNAT_REQUEST_TIMEOUT_SECONDS:30}
app.sunat.xsd.enabled=${SUNAT_XSD_ENABLED:false}
app.sunat.xsd.path=${SUNAT_XSD_PATH:./sunat-resources/xsd}

logging.level.root=INFO
logging.level.pe.com.perubilling=INFO
logging.pattern.level=%5p [traceId=%X{traceId:-} tenantId=%X{tenantId:-}]

app.processing.max-reconciliations=${PROCESSING_MAX_RECONCILIATIONS:8}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
app.outbox.poll-ms=${OUTBOX_POLL_MS:1000}
app.public.base-url=${PUBLIC_BASE_URL:http://localhost:8080}

app.sunat.cdr.max-zip-bytes=${SUNAT_CDR_MAX_ZIP_BYTES:5242880}
app.sunat.cdr.max-xml-bytes=${SUNAT_CDR_MAX_XML_BYTES:10485760}
app.sunat.cdr.max-entries=${SUNAT_CDR_MAX_ENTRIES:8}
app.sunat.cdr.max-compression-ratio=${SUNAT_CDR_MAX_COMPRESSION_RATIO:200}

app.summary.auto-enabled=${SUMMARY_AUTO_ENABLED:true}
app.summary.auto-poll-ms=${SUMMARY_AUTO_POLL_MS:900000}
app.summary.auto-initial-delay-ms=${SUMMARY_AUTO_INITIAL_DELAY_MS:60000}
app.summary.auto-min-age-minutes=${SUMMARY_AUTO_MIN_AGE_MINUTES:15}
app.summary.auto-max-groups=${SUMMARY_AUTO_MAX_GROUPS:100}
app.artifacts.max-read-bytes=${ARTIFACTS_MAX_READ_BYTES:52428800}
app.artifacts.require-checksum=${ARTIFACTS_REQUIRE_CHECKSUM:false}
app.operations.metrics-refresh-ms=${OPERATIONS_METRICS_REFRESH_MS:60000}

app.artifacts.backend=${ARTIFACTS_BACKEND:filesystem}
app.production.guard.enabled=${PRODUCTION_GUARD_ENABLED:false}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.api-key-last-used-write-interval-seconds=${API_KEY_LAST_USED_WRITE_INTERVAL_SECONDS:300}


management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,artifactStorage,sunatXsd
